<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorite Quotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/favquotes.css">
</head>

<body style="height: 100vh; width: 100%;">
    <div class="container">
        <div class="my-4">
            <h2>Favorite Quotes History</h2>
            <a href="/quote.html" class="btn btn-outline-info">Back</a>
        </div>

        <div id="fav-quotes-div">
            <div class="shadow rounded p-2 my-3">
                <p class="fs-3 fw-bold">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quia, dolore.</p>
                <p class="fs-5">Lorem, ipsum dolor.</p>
                <button class="btn btn-danger">Remove</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        function DeleteQuote(i) {
            console.log("remove");
            const dataQuotes = JSON.parse(localStorage.getItem("favList"));
            dataQuotes.splice(i, 1);
            localStorage.setItem("favList", JSON.stringify(dataQuotes));
            displayFavQuotes();
        }

        const FavContainer = document.getElementById("fav-quotes-div");

        function displayFavQuotes() {
            const dataQuotes = JSON.parse(localStorage.getItem("favList")) || [];
            FavContainer.innerHTML = "";

            dataQuotes.map((QuoteDta, i) => {
                const div = document.createElement("div");
                div.innerHTML = `<div class="shadow rounded p-3 m-3">
            <p class="fs-3">"${QuoteDta.quote}"</p>
            <p class="fs-5">~ ${QuoteDta.author}</p>
            <button onclick="DeleteQuote(${i})" class="btn btn-danger">Remove</button>
        </div>`;
                FavContainer.appendChild(div);
            });
        }

        displayFavQuotes();
    </script>
</body>

</html>
