<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quote's slider</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="/quote.css">
</head>

<body style="height: 100vh;">

    <div class="container">
        <a href="/favquotes.html">Favorite quotes</a>
    </div>

    <div class="h-100 container d-flex justify-content-center align-items-center flex-column">
        <div id="codes-screen" style="display: flex; justify-content:center; align-items:center; flex-direction:column"
            class="h-50 w-50 p-4 shadow my-4 rounded">
            <p id="quote-text" class="fw-bold fs-4">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ut illo
                vero nihil
                tenetur
                nulla necessitatibus quasi beatae libero corrupti est?</p>
            <p id="author-text" class="fw-bold fs-6">Lorem, ipsum dolor.</p>
        </div>
        <div class="d-flex justify-content-center align-items-center rounded-1 p-2">
            <button id="btn-prev" class="btn btn-outline-warning m-2"><i class="ri-arrow-left-line"></i>
                Previous</button>
            <button id="btn-like" class="btn btn-outline-danger m-2">Like <i class="ri-heart-line"></i></button>
            <button id="btn-next" class="btn btn-outline-primary m-2">Next <i class="ri-arrow-right-line"></i></button>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/quote.js"></script>

</body>

</html>
