<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div
        style="height:100vh; width:100%; display:flex; justify-content:center; align-items:center; flex-direction:column; font-size:100px;">
        <h2 id="count">0</h2>
        <button
            style="width: 250px; height: 60px; margin: 5px; border: none; background-color:#4caf50; color:white; font-size:30px;"
            id="button1">++</button>
        <button
            style="width: 250px; height: 60px; margin: 5px; border: none; background-color:#f44336; color:white; font-size:30px;"
            id="button2">--</button>
        <button
            style="width: 250px; height: 60px; margin: 5px; border: none; background-color:#2196f3; color:white; font-size:30px;"
            id="button3">*</button>
        <button
            style="width: 250px; height: 60px; margin: 5px; border: none; background-color:#ff9800; color:white; font-size:30px;"
            id="button4">/</button>
        <button
            style="width: 250px; height: 60px; margin: 5px; border: none; background-color:#9c27b0; color:white; font-size:30px;"
            id="button5">%</button>
        <button
            style="width: 250px; height: 60px; margin: 5px; border: none; background-color:#607d8b; color:white; font-size:30px;"
            id="button6">reset</button>

    </div>




    <script src="/script.js"></script>
</body>

</html>
