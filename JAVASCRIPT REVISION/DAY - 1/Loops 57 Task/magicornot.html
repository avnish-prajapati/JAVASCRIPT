<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>


        // wap a program to perform magic number or not ..

        // while .. loop 

        let num = 123;
        let sum = 0;
        let mul = 1;

        while(num > 0)
    {
        let ld = num % 10; //1 // 2 //1
        sum = sum + ld; //1  //3   //4
        mul = mul * ld;//1  // 3    // 1

        num = Math.floor(num / 10); // 12 // 1 //0
    }

    if(mul == sum) 
    {
        console.log("This is a magic number !");
    }
    else 
    {
        console.log("This is not a magic number !");
    }








    </script>
</body>
</html>
