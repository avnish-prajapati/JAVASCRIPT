    <!-- 17. wap ajs program to calculate grade marks of 5 subjects with percentage -->

    <script>
        let math = 50;
        let eng = 66;
        let hindi = 40;
        let ss = 70;
        let science = 80;

        let total = math + eng + hindi + ss + science;
        console.log("The total marks is = ", total);

        let percentage = ((total * 100) / 500);
        console.log("the percentage is = ", percentage);
    </script>
