<body>

    <!-- 
    2. wap a js program to swap two number without a third variable. -->

    <script>

        let x = 10;
        let y = 5;

        console.log("before swap", x, y);

        x = x + y;
        y = x - y;
        x = x - y;

        console.log("after swap", x, y);


    </script>
</body>
