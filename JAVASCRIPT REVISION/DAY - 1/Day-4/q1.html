<body>


    <!-- 1. wap a js program to swap two number using third variable.. -->

    <script>

        let x = 5;
        let y = 8;
        let z;

        console.log("before swap", x, y);

        z = x;
        x = y;
        y = z;

        console.log("after swap", x, y);



    </script>
