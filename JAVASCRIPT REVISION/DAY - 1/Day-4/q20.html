<body>


    <!-- 20. wap a js program to check if numm is even or odd  using moduls operator. -->

    <script>
        let num = 7;

        if (num % 2 == 0) {
            console.log("The number is even !");
        }
        else {
            console.log("The number is odd !");
        }
    </script>
